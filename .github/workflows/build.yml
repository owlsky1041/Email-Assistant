name: 构建三平台发行包

# PyInstaller / Nuitka 都**不支持交叉编译**，因此必须在各目标系统上原生构建。
# 这个工作流用 GitHub 的原生 runner 完成这件事：
#
#   test          —— 在 ubuntu / windows 上跑测试，验证跨平台正确性
#   export-model  —— 导出 ONNX 嵌入模型并作为独立发行附件发布
#   build         —— 并行打包，产出 setup.exe / zip / AppImage / tar.gz
#   release       —— 打 tag 时自动创建 Release 并附上全部产物
#
# 交付目标：Windows 为主，Linux 用于验证打包链路。
# macOS 暂不在范围内（脚本见 packaging/build_macos.sh，未验证、不进 CI）。
#
# 想在自己机器上构建：见 packaging/build_{windows,linux}.sh（.ps1）

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bundle_model:
        description: "把 ONNX 模型打进发行包（体积 +95MB，但开箱即用语义检索）"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Windows runner 默认代码页是 cp1252，统一 UTF-8，
  # 否则中文输出与文件读写会出现编码问题
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # 注意：不要在这里强制 HF_ENDPOINT=https://hf-mirror.com。
  # GitHub runner 在海外，直连 huggingface.co 更快更稳；设成镜像反而拖慢。
  # 中国大陆用户本地构建时，自行 export HF_ENDPOINT=https://hf-mirror.com

jobs:
  # ---------------------------------------------------------------------------
  # 1) 跨平台测试
  # ---------------------------------------------------------------------------
  test:
    name: 测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
        exclude:
          # Windows 上只跑一个版本，省 CI 时间
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 装上可选依赖，让 ChromaDB / ONNX 相关测试真正执行而不是被 skip
          pip install -r requirements-optional.txt

      # Linux 默认不带 tkinter，而"浏览…"目录选择框依赖它。
      # 不装的话这条代码路径永远不会被执行 —— 之前就是这样漏掉了
      # 托盘标题的 latin-1 编码崩溃。
      - name: Linux 额外依赖（tkinter，用于目录选择框）
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk xvfb x11-utils

      # 在虚拟显示下跑一遍 GUI 路径：托盘图标构造、目录选择框。
      # 无头环境下这两条路径会提前降级，等于从未被测试过。
      - name: GUI 冒烟（虚拟显示）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          xvfb-run -a --server-args="-screen 0 1280x800x24" python - <<'PYGUI'
          import os, sys, threading, time
          sys.path.insert(0, ".")

          # 1) tkinter 与目录选择框必须可用
          import tkinter
          from tkinter import filedialog
          print("tkinter", tkinter.TkVersion)

          # 2) 托盘图标必须能用当前平台的标题构造出来
          from src.tray_app import TRAY_AVAILABLE, build_icon_image, tray_title
          assert TRAY_AVAILABLE, "pystray / Pillow 应当可用"
          img = build_icon_image(64)
          assert img is not None and img.size == (64, 64)

          import pystray
          menu = pystray.Menu(pystray.MenuItem("设置…", lambda *a: None))
          # 这一步过去会在 X11 上抛 UnicodeEncodeError
          icon = pystray.Icon("email-assistant", icon=img, title=tray_title(), menu=menu)
          errors = []

          def _run():
              try:
                  icon.run()
              except Exception as exc:  # noqa: BLE001
                  errors.append(exc)

          threading.Thread(target=_run, daemon=True).start()
          time.sleep(3)
          assert not errors, f"托盘运行异常：{errors}"
          icon.stop()
          print("GUI 冒烟通过：tkinter 可用、托盘可构造可运行")

          # 3) 目录选择框能真正创建窗口
          root = tkinter.Tk(); root.withdraw()
          root.after(1200, root.destroy)
          threading.Thread(target=lambda: filedialog.askdirectory(), daemon=True).start()
          time.sleep(0.8)
          print("目录选择框已弹出")
          try: root.destroy()
          except Exception: pass
          PYGUI

      - name: 运行测试
        shell: bash
        env:
          # 测试不应触碰真实配置
          EMAIL_ASSISTANT_HOME: ${{ runner.temp }}/ea-test-home
          # Windows runner 默认 cp1252，强制 UTF-8，否则中文输出会解码失败
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          set +e
          python -m pytest tests/ -v --tb=short > pytest.log 2>&1
          rc=$?
          tail -60 pytest.log

          if [ $rc -ne 0 ]; then
            # 失败用例名写入注解，便于快速定位（注解可匿名读取）
            failed=$(grep -E "^(FAILED|ERROR) " pytest.log | head -15 | sed 's/ - .*//' | tr '\n' ';')
            echo "::error title=pytest 失败::${failed:-未知，见下方完整日志}"
            echo "----- 失败详情 -----"
            grep -E "^(FAILED|ERROR) " -A 12 pytest.log | head -150
          fi
          exit $rc

  # ---------------------------------------------------------------------------
  # 2) 导出 ONNX 嵌入模型
  # ---------------------------------------------------------------------------
  export-model:
    name: 导出 ONNX 嵌入模型
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装导出工具链（CPU-only，避免拉取 CUDA 依赖）
        run: |
          python -m pip install --upgrade pip
          # PyPI 默认的 torch 会带上 2-3GB 的 CUDA 依赖，必须显式用 CPU 索引
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          # onnxruntime 在 optimum-onnx 里属于 [onnxruntime] extra，不是硬依赖。
          # 不装的话导出到"修正动态轴"这一步会报
          #   RuntimeError: The onnx and onnxruntime packages are necessary...
          pip install optimum-onnx onnxruntime

      - name: 缓存 HuggingFace 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-zh-v1.5

      - name: 导出 ONNX
        shell: bash
        run: |
          set +e
          mkdir -p data/models

          # 不显式指定 --opset：optimum 对 bert 推荐 opset>=18，
          # 硬写 17 会告警"可能失败"，实测在不同 torch 版本下确实会挂。
          optimum-cli export onnx \
            --model BAAI/bge-small-zh-v1.5 \
            --task feature-extraction \
            data/models > export.log 2>&1
          rc=$?

          tail -40 export.log

          if [ $rc -ne 0 ]; then
            # 把错误尾部写进注解：注解可匿名读取，便于无 token 时定位问题
            err=$(tail -c 600 export.log | tr '\n' ' ' | tr -s ' ')
            echo "::error title=ONNX 导出失败::${err}"
            echo "----- 完整日志 -----"
            cat export.log
          fi
          exit $rc

      - name: 校验导出结果
        run: |
          python -m pip install -r requirements.txt
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from src.embedder import OnnxEmbedder
          e = OnnxEmbedder("data/models")
          print("维度:", e.dimension, "推荐阈值:", e.recommended_min_score)
          vs = e.embed(["差旅报销发票", "服务器扩容", "今天天气"])
          assert len(vs) == 3 and len(vs[0]) == e.dimension
          import math
          for v in vs:
              assert abs(math.sqrt(sum(x*x for x in v)) - 1.0) < 1e-4, "向量未归一化"
          print("模型自检通过")
          PY

      - name: 打包模型
        run: |
          cd data/models
          zip -r ../../bge-small-zh-v1.5-onnx.zip . -x "*.tmp"
          cd ../..
          ls -lh bge-small-zh-v1.5-onnx.zip

      - uses: actions/upload-artifact@v4
        with:
          name: onnx-model
          path: bge-small-zh-v1.5-onnx.zip
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3) 三平台打包
  # ---------------------------------------------------------------------------
  build:
    name: 打包 (${{ matrix.os }})
    needs: [test, export-model]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        # 当前只交付 Windows 与 Linux。
        # macOS 已按需求搁置：构建脚本仍在（packaging/build_macos.sh），
        # 但不再进入 CI，也未做过真机验证，因此不作分发承诺。
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-latest
            artifact: linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-optional.txt
          pip install pyinstaller

      - name: Linux 额外依赖（libpython 供 PyInstaller；tkinter 供目录选择框）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpython3.13 || sudo apt-get install -y -qq libpython3.12
          sudo apt-get install -y -qq python3-tk

      - name: 下载 ONNX 模型（供 --bundle_model 使用）
        uses: actions/download-artifact@v4
        with:
          name: onnx-model
          path: model-artifact

      - name: 解压模型
        shell: bash
        run: |
          mkdir -p data/models
          if [ -f model-artifact/bge-small-zh-v1.5-onnx.zip ]; then
            unzip -o model-artifact/bge-small-zh-v1.5-onnx.zip -d data/models
            ls -lh data/models
          fi

      - name: 构建
        shell: bash
        run: |
          set +e
          case "$RUNNER_OS" in
            Linux)
              # appimagetool 只影响是否额外出 AppImage；装不上也已有 tar.gz 兜底。
              # 注意：它自身是 AppImage，运行依赖 FUSE，脚本里已做解包回退。
              if curl -sSL --retry 3 --max-time 180 \
                   -o /usr/local/bin/appimagetool \
                   https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage; then
                chmod +x /usr/local/bin/appimagetool
                echo "appimagetool 下载成功 ($(du -h /usr/local/bin/appimagetool | cut -f1))"
              else
                echo "!! appimagetool 下载失败，将跳过 AppImage"
              fi
              chmod +x packaging/build_linux.sh
              ./packaging/build_linux.sh > build.log 2>&1
              ;;
            Windows)
              # Inno Setup 只用于生成安装程序，装不上也不影响 zip 绿色版
              choco install innosetup --no-progress -y || echo "!! Inno Setup 安装失败，将只产出 zip"
              pwsh -NoProfile -File packaging/build_windows.ps1 > build.log 2>&1
              ;;
          esac
          rc=$?

          tail -60 build.log

          # 把脚本里的降级告警（以 "!!" 或 "! " 开头）汇总成注解。
          # 这类"静默降级"会让产物悄悄缺失（例如 AppImage 没生成、
          # setup.exe 没生成），只看任务成功与否完全发现不了。
          warns=$(grep -E '^\s*(!!|! )' build.log | head -12 | sed 's/^[[:space:]]*//' | tr '\n' '|')
          if [ -n "$warns" ]; then
            echo "::warning title=构建降级告警 ($RUNNER_OS)::${warns}"
          fi

          # 校验关键产物确实存在，缺失就失败，避免"绿色但没东西"
          missing=""
          case "$RUNNER_OS" in
            Linux)   [ -n "$(ls dist/*.tar.gz 2>/dev/null)" ] || missing="$missing linux-tar.gz" ;;
            Windows) [ -n "$(ls dist/*.zip 2>/dev/null)" ] || missing="$missing windows-zip" ;;
          esac
          if [ -n "$missing" ]; then
            echo "::error title=关键产物缺失 ($RUNNER_OS)::${missing}"
            rc=1
          fi

          # 期望但非必需的产物：缺失只告警，附带脚本给出的原因
          case "$RUNNER_OS" in
            Linux)   [ -n "$(ls dist/*.AppImage 2>/dev/null)" ] || echo "::warning title=未生成 AppImage::见上一条降级告警中的原因" ;;
            Windows) [ -n "$(ls dist/*setup.exe 2>/dev/null)" ] || echo "::warning title=未生成安装程序::Inno Setup 可能未安装" ;;
          esac

          echo "=== 实际产物 ==="
          find dist -maxdepth 1 -type f \( -name "*.tar.gz" -o -name "*.zip" \
            -o -name "*.AppImage" -o -name "*.exe" \) \
            -exec du -h {} + 2>/dev/null || true

          exit $rc

      - name: 把模型打进发行包
        if: ${{ github.event.inputs.bundle_model == 'true' }}
        shell: bash
        run: |
          for d in dist/email-assistant; do
            if [ -d "$d" ]; then
              mkdir -p "$d/data/models"
              cp data/models/* "$d/data/models/" 2>/dev/null || true
              echo "已注入模型到 $d"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
            dist/*setup.exe
          if-no-files-found: warn
          retention-days: 30

      # 纯展示步骤：必须放在上传之后，且不能因为自身出错而拖垮整个任务。
      # 早先写成 `ls -lhR dist/ | head -40`，GitHub Actions 的 bash 默认启用
      # -o pipefail，head 提前关闭管道会让 ls 收到 SIGPIPE（退出码 141），
      # 于是这一步失败并**跳过了产物上传** —— 打包明明成功却拿不到产物。
      - name: 列出产物
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          echo "=== dist 顶层 ==="
          ls -la dist/ 2>/dev/null || true
          echo
          echo "=== 发行包大小 ==="
          find dist -maxdepth 1 -type f \( -name "*.tar.gz" -o -name "*.zip" \
            -o -name "*.AppImage" -o -name "*.exe" \) \
            -exec du -h {} + 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # 4) 发布（仅在打 tag 时）
  # ---------------------------------------------------------------------------
  release:
    name: 创建 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理产物
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \
            -o -name "*.AppImage" -o -name "*setup.exe" \) \
            -exec cp {} release/ \;
          # 模型作为独立附件一并发布，方便用户按需下载
          cp artifacts/onnx-model/bge-small-zh-v1.5-onnx.zip release/ 2>/dev/null \
            || echo "未找到模型附件，跳过"
          ls -lh release/

      - name: 生成校验和
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 重新发布同一个 tag 时（例如修好产物名后重发），旧产物会残留成
      # 一堆过时文件。这里先清空，保证 Release 内容始终与本次构建一致。
      - name: 清理该 Release 的旧产物
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          echo "::notice title=清理环境::gh=$(command -v gh || echo 缺失) token=$([ -n "${GH_TOKEN:-}" ] && echo 已设置 || echo 为空)"

          # 先按 tag 查；查不到再遍历 releases 按 tag_name 匹配。
          # 必须这样兜底：删除并重新推送 tag 时，Release 对象仍保留，
          # 但 /releases/tags/<tag> 会 404 —— 只用前者会漏掉清理，
          # 结果新产物被"追加"到旧 Release 上，新旧混杂。
          # 关键：gh api 在 404 时会把**错误 JSON 打到 stdout**，
          # `--jq .id` 照样处理它并返回非空字符串，再用 `|| true` 吞掉
          # 非零退出码，rid 就变成了 {"message":"Not Found"...} 这样的垃圾值，
          # 后续按它查询必然一无所获，兜底分支也永远不会触发。
          # 因此必须校验 rid 是纯数字。
          _numeric_or_empty() { case "$1" in '' | *[!0-9]*) printf '' ;; *) printf '%s' "$1" ;; esac; }

          rid=$(_numeric_or_empty "$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id' 2>/dev/null)")
          if [ -z "$rid" ]; then
            # 兜底：按 tag_name 遍历。覆盖"tag 被删除后重新推送、
            # /releases/tags/<tag> 暂时 404 但 Release 仍存在"的情况。
            rid=$(_numeric_or_empty "$(gh api "repos/$REPO/releases?per_page=100" \
                    --jq ".[] | select(.tag_name==\"$TAG\") | .id" 2>/dev/null | head -1)")
          fi

          if [ -z "$rid" ]; then
            echo "尚无 Release $TAG，跳过清理"
            exit 0
          fi

          echo "清理 Release $TAG (id=$rid) 的旧产物"
          ids=$(gh api "repos/$REPO/releases/$rid/assets?per_page=100" --jq '.[].id' 2>/dev/null || true)
          # 只保留纯数字 id，防止错误 JSON 混入
          ids=$(printf '%s\n' "$ids" | grep -E '^[0-9]+$' || true)
          total=$(printf '%s\n' "$ids" | grep -c . || true)
          deleted=0
          for aid in $ids; do
            if gh api -X DELETE "repos/$REPO/releases/assets/$aid" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            fi
          done
          echo "清理完成：发现 $total 个产物，删除 $deleted 个"
          # 把结果写成注解：注解可匿名读取，便于确认清理是否真的生效
          echo "::notice title=Release 产物清理::tag=$TAG rid=$rid 发现=${total} 删除=${deleted}"

          # 清理后再次核对，残留则告警（避免再次出现新旧混杂却无人察觉）
          left=$(gh api "repos/$REPO/releases/$rid/assets?per_page=100" --jq 'length' 2>/dev/null || echo "?")
          echo "::notice title=清理后剩余产物数::${left}"

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | **Windows** | `EmailAssistant-*-windows-setup.exe` | 安装程序（推荐） |
            | **Windows** | `email-assistant-*-windows-x64.zip` | 绿色免安装版 |
            | Linux | `*.AppImage` | `chmod +x` 后直接运行 |
            | Linux | `*-linux-x86_64.tar.gz` | 解压即用 |

            > macOS 暂不提供：构建脚本仍在 `packaging/build_macos.sh`，
            > 但未纳入 CI，也未做过真机验证。

            ## 启用语义检索

            发行包默认不含 95MB 的 ONNX 嵌入模型（仅有词法检索兜底）。
            下载下面的模型附件后，一条命令即可启用真正的语义检索：

            ```bash
            # 解压模型附件到本地目录，然后导入
            ./email-assistant model import /path/to/bge-small-zh-v1.5-onnx
            ./email-assistant index --rebuild
            ```

            详见 README 的「启用真正的语义检索」。

            ## 校验

            下载后可用 `SHA256SUMS.txt` 校验完整性。
